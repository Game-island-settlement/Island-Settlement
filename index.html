<script>
// Loader: pick a CDN that works, register the import map, then start the game module (so exported/offline-opened copies fail loudly instead of showing a blank blue screen)
(function () {
  var BASES = ['https://cdn.jsdelivr.net/npm/three@0.160.0/', 'https://fastly.jsdelivr.net/npm/three@0.160.0/', 'https://unpkg.com/three@0.160.0/'];
  function fail(msg) {
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#0b1e33;color:#fff;font:16px system-ui;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px';
    d.innerHTML = '<div style="max-width:520px"><h2>Could not start the game</h2><p>' + msg + '</p><p style="opacity:.7;font-size:13px">The game loads the Three.js 3D library from the internet, so an internet connection is needed (the exported file works when online).</p><button onclick="location.reload()" style="padding:10px 18px;font-size:15px">Retry</button></div>';
    (document.body || document.documentElement).appendChild(d);
  }
  window.addEventListener('error', function (e) { if (!window.__gameUp) console.error(e.message); });
  window.addEventListener('unhandledrejection', function (e) { if (!window.__gameUp) console.error(String(e.reason)); });
  function probe(i) {
    if (i >= BASES.length) { fail('None of the 3D library servers could be reached.'); return; }
    var b = BASES[i];
    // probe with a classic <script> (small file): it must NOT be a module load, because an import map is ignored once any module has started loading
    var p = document.createElement('script'), done = false;
    var go = function (ok) {
      if (done) return; done = true; p.remove();
      if (!ok) { probe(i + 1); return; }
      var m = document.createElement('script'); m.type = 'importmap';
      m.textContent = JSON.stringify({ imports: { three: b + 'build/three.module.js', 'three/addons/': b + 'examples/jsm/' } });
      document.head.appendChild(m);
      var g = document.createElement('script'); g.type = 'module';
      g.textContent = document.getElementById('game-src').textContent;
      document.body.appendChild(g);
      setTimeout(function () { if (!window.__gameUp) fail('The game started loading but did not finish (check your connection, or press F12 and send me the red error).'); }, 25000);
    };
    p.onload = function () { go(true); }; p.onerror = function () { go(false); };
    setTimeout(function () { go(false); }, 8000);
    p.src = b + 'examples/jsm/controls/OrbitControls.js';
    document.head.appendChild(p);
  }
  window.addEventListener('DOMContentLoaded', function () { probe(0); });
})();
</script>

<script type="text/plain" id="game-src">

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

let state = {
  gold: 300, wood: 100, pop: 10, popCap: 10,
  influence: 0, goldRate: 0, woodRate: 0, selectedTool: 'house'
};

const BUILDINGS = {
  house:  { gold: 30,  wood: 20, popCap: 15, goldRate: 0, woodRate: 0, inf: 5 },
  lumber: { gold: 40,  wood: 10, popCap: 0,  goldRate: 0, woodRate: 3, inf: 10 },
  market: { gold: 60,  wood: 40, popCap: 0,  goldRate: 4, woodRate: 0, inf: 15 },
  tower:  { gold: 120, wood: 80, popCap: 5,  goldRate: 2, woodRate: 0, inf: 50 }
};

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function makeNoise(rand){
  const lat=new Float32Array(256*256);
  for(let i=0;i<lat.length;i++)lat[i]=rand();
  const s=t=>t*t*(3-2*t);
  const at=(x,y)=>lat[((y&255)<<8)|(x&255)];
  return (x,y)=>{
    const xi=Math.floor(x),yi=Math.floor(y),xf=s(x-xi),yf=s(y-yi);
    const a=at(xi,yi),b=at(xi+1,yi),c=at(xi,yi+1),d=at(xi+1,yi+1);
    return a+(b-a)*xf+(c-a)*yf+(a-b-c+d)*xf*yf;
  };
}
function fbm(n,x,y,o=5){let v=0,a=0.5,f=1,sum=0;for(let i=0;i<o;i++){v+=n(x*f,y*f)*a;sum+=a;a*=0.5;f*=2;}return v/sum;}
// Terrain, 8 continents, ~200 countries. Pure data, no rendering.
const CONTINENT_NAMES=['Veridia','Norvaland','Solara','Ymiria','Atlantica','Zephyria','Kharos','Oceanor'];
function generateWorld(W,H,rand,targetCountries=200){
  const nWarp=makeNoise(rand), nWarp2=makeNoise(rand), nCoast=makeNoise(rand), nElev=makeNoise(rand), nRiver=makeNoise(rand), nRidge=makeNoise(rand), nCost=makeNoise(rand), N=W*H;
  // 4x2 grid of continents with jittered centres and sizes
  const cw=W/4, ch=H/2, conts=[];
  for(let r=0;r<2;r++)for(let c=0;c<4;c++)conts.push({
    cx:(c+0.5)*cw+(rand()-0.5)*cw*0.4, cz:(r+0.5)*ch+(rand()-0.5)*ch*0.3,
    rx:cw*(0.30+rand()*0.22), rz:ch*(0.28+rand()*0.24), col:c, row:r
  });
  // land bridges join some neighbouring continents (Eurasia / Americas style); others stay separate
  const pairs=[];
  for(let r=0;r<2;r++)for(let c=0;c<4;c++){const k=r*4+c;if(c<3)pairs.push([k,k+1]);if(r<1)pairs.push([k,k+4]);}
  for(let k=pairs.length-1;k>0;k--){const j=(rand()*(k+1))|0;[pairs[k],pairs[j]]=[pairs[j],pairs[k]];}
  const bridges=pairs.slice(0,3+((rand()*2)|0)).map(([a,b])=>({a:conts[a],b:conts[b],hw:20+rand()*12}));
  // a few island chains in the gaps, tagged with the nearest continent
  const shapes=[];
  conts.forEach((q,k)=>{
    shapes.push({cx:q.cx,cz:q.cz,rx:q.rx*0.75,rz:q.rz*0.75,id:k});
    const n=3+((rand()*3)|0);       // 3-5 lobes -> peninsulas, bulges, bays instead of a clean ellipse
    for(let l=0;l<n;l++){
      const a=rand()*6.283,rr=0.3+rand()*0.55;
      shapes.push({cx:q.cx+Math.cos(a)*q.rx*rr,cz:q.cz+Math.sin(a)*q.rz*rr,rx:q.rx*(0.3+rand()*0.4),rz:q.rz*(0.3+rand()*0.4),id:k});
    }
  });
  for(let n=0;n<14;n++){
    const cx=rand()*W,cz=rand()*H;let bk=0,bd=1e9;
    conts.forEach((q,k)=>{const d=Math.hypot(cx-q.cx,cz-q.cz);if(d<bd){bd=d;bk=k;}});
    shapes.push({cx,cz,rx:6+rand()*10,rz:5+rand()*8,id:bk});
  }
  const v=new Float32Array(N), e=new Float32Array(N), cont=new Int8Array(N), isLand=new Uint8Array(N);
  for(let z=0;z<H;z++)for(let x=0;x<W;x++){
    const i=z*W+x;
    const wx=x+(fbm(nWarp,x*0.012,z*0.012,3)-0.5)*80+(fbm(nWarp2,x*0.05+3,z*0.05+3,3)-0.5)*16, wz=z+(fbm(nWarp2,x*0.012,z*0.012,3)-0.5)*80+(fbm(nWarp,x*0.05+9,z*0.05+9,3)-0.5)*16;
    let best=-9,bc=0;
    for(const q of shapes){const d=Math.hypot((wx-q.cx)/q.rx,(wz-q.cz)/q.rz),sh=1-d;if(sh>best){best=sh;bc=q.id;}}
    let ridge=0;
    for(const br of bridges){
      // a broad, irregular land connection: its width swells and pinches along the way (plains, gulfs, isthmuses)
      const ax=br.a.cx,az=br.a.cz,bx=br.b.cx-ax,bz=br.b.cz-az;
      const t=Math.max(0,Math.min(1,((wx-ax)*bx+(wz-az)*bz)/(bx*bx+bz*bz)));
      const width=br.hw*(0.55+0.9*fbm(nCoast,(ax+bx*t)*0.03+7,(az+bz*t)*0.03+7,2));
      const dr=Math.hypot(wx-(ax+bx*t),wz-(az+bz*t))/width;
      const sh=0.9*(1-dr*dr);
      if(sh>best)best=sh;
      if(dr<0.6)ridge=Math.max(ridge,1-dr/0.6);   // a mountain range along the join

function declareWar(a, b) {
  const A = countries[a], B = countries[b];
  for (const X of [A, B]) if (!atWar(X)) X.warBase = power(X);   // army size when the fighting began: wartime reinforcements are capped relative to this
  wars.push({ a, b, start: gt, initA: A.tiles.length, initB: B.tiles.length, lostA: 0, lostB: 0, stale: 0, ticks: 0, peaceCool: 0 });

// ---- player diplomacy (acceptance is a roll: alliances ~45%, money ~20%, land ~14%, peace 20-75%) ----
const cdLeft = (c, k) => Math.ceil(Math.max(0, (c.cool[k] || 0) - gt));

  const p = 0.45 + Math.max(-0.1, Math.min(0.1, (player.influence - c.influence) / 300)) + c.favor * 0.01;

    player.allies.add(c.id); c.allies.add(player.id); c.favor += 3;
    log(`🤝 ${c.name} accepted an alliance with you`, 'peace'); toast(`🤝 ${c.name} is now your ally!`);

}
function breakAlliance(c) {

}
function askMoney(c) {

  if (c.gold >= 30 && Math.random() < p) {

    log(`💰 ${c.name} gave you ${fmt(amount)} gold`, 'peace'); toast(`💰 ${c.name} sent you ${fmt(amount)} gold`);
  } else { c.cool.money = gt + 25; toast(`${c.name} said no`); }
}
function askLand(c) {

  const cand = borderTiles(c, player, false);
  if (!cand.length) { toast(`You share no border with ${c.name}`); return; }
  const p = (player.allies.has(c.id) ? 0.22 : 0.14) + c.favor * 0.004;
  if (Math.random() < p) {

    const n = Math.min(cand.length, 4 + Math.floor(Math.random() * 7));

// Real strength = own army + 35% of each ally's army. Shown everywhere so the numbers match how wars are decided.
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
function oddsHTML(c) {

function playerDeclareWar(c) {

  popup(`<b>⚔️ Declare war on ${esc(c.name)}?</b>${oddsHTML(c)}<small>Both sides can buy units during a war and allies lend 35% of their army, so check the numbers.</small>`,
    [{ label: '⚔️ Declare war', fn: () => { if (!warBetween(player.id, c.id)) { declareWar(player.id, c.id); toast(`⚔️ War on ${c.name}!`); } } }, { label: 'Cancel' }], 1e9);
}
function askPeace(w) {

  const enemy = countries[w.a === player.id ? w.b : w.a], r = (effPower(enemy) + 1) / (effPower(player) + 1);

// ---- player purchases ----
function buyUnit(k, n) {
  const cost = unitCost(player, k) * n;
  if (player.gold < cost) { toast('Not enough gold'); return; }
  player.gold -= cost; player.units[k] += n; updateUI(); dirtyPanel = true;
}
function buyCompany(k) {

  log(`🏢 You founded a ${COMPANIES[k].name}`, ''); updateUI(); dirtyPanel = true;
}

// ---- AI brain ----
const aiCountries = countries.filter(c => c !== player);
function aiPlaceBuilding(c, type) {
  for (let tries = 0; tries < 12; tries++) {
    const t = c.tiles[Math.floor(Math.pow(Math.random(), 2) * c.tiles.length)];
    if (!t || t.building || t.isBeach) continue;
    placeBuilding(t, type); applyBuilding(c, type, 1);

  }

}
function aiDev(c) { const cost = 80 + c.dev * 40; if (c.gold >= cost) { c.gold -= cost; c.dev++; c.popCap += 3; c.influence += 2; } }

  const war = atWar(c), want = 3 + c.tiles.length * 0.06 + c.influence * 0.1 + c.gold * 0.004;
  const warRoom = !war || (power(c) < (c.warBase || 0) * 1.2 + 10 && gt >= (c.buyCool || 0));   // at war: at most +20% over the starting army, one purchase per 8s

    if (war) c.buyCool = gt + 8;

    const maxAdd = 8 + power(c) * (war ? 0.05 : 0.25);       // armies grow gradually, never in one huge shopping spree

    if (keys.length) {

    const type = need && q < 0.5 ? 'house' : q < 0.4 ? 'house' : q < 0.6 ? 'lumber' : q < 0.88 ? 'market' : 'tower';
    const cost = BUILDINGS[type];
    if (c.gold >= cost.gold && c.wood >= cost.wood && aiPlaceBuilding(c, type)) { c.gold -= cost.gold; c.wood -= cost.wood; }
  } else if (r < 0.75) {

}
let brainIdx = 0;
function aiBrain() {
  for (let n = 0; n < 20; n++) {

    for (let k = 1 + Math.min(5, Math.floor(c.gold / 400)); k > 0; k--) aiThink(c); // rich nations spend more per turn
  }
}
const alive = () => aiCountries.filter(c => !c.dead);
function neighbourOf(c) {
  const ids = new Set();
  for (let i = 0; i < 14; i++) {

    for (const j of neighbours(t)) if (land[j].country !== c.id) ids.add(land[j].country);
  }

}
function aiDiplomacy() {
  const list = alive();
  for (let n = 0; n < 6; n++) {
    const a = list[(Math.random() * list.length) | 0];
    if (a.dead || atWar(a)) continue;
    const b = neighbourOf(a);
    if (!b || b.dead || a.allies.has(b.id) || truceLeft(a.id, b.id) || warBetween(a.id, b.id)) continue;
    if (b === player && (gt < 180 || wars.filter(w => w.a === player.id || w.b === player.id).length >= 2)) continue;
    if (wars.length < 12 && power(a) > 6 && power(a) > effPower(b) * (b === player ? 2.5 : 2) + 3 && Math.random() < 0.25) {

      if (b === player) popup(`<b>⚔️ ${a.name} declared war on you!</b><br>Their power: ${fmt(power(a))} · yours: ${fmt(power(player))}.<br>Buy units in the Military tab or ask for peace.`, [{ label: 'OK' }], 20000);

// an ally at war asks you for units
let popupOpen = false;
function allyRequestCheck() {

  if (!reqs.length || Math.random() > 0.2) return;
  const w = reqs[(Math.random() * reqs.length) | 0], ally = countries[player.allies.has(w.a) ? w.a : w.b], foe = countries[w.a === ally.id ? w.b : w.a];

  const [k, nWanted] = opts[(Math.random() * opts.length) | 0], n = Math.min(nWanted, Math.floor(player.units[k] / 2));
  popup(`<b>🤝 ${ally.name} needs help!</b><br>They are at war with ${foe.name} and ask for <b>${n} ${UNITS[k].name.toLowerCase()}</b>.`, [

      log(`🤝 You sent ${n} ${UNITS[k].name.toLowerCase()} to ${ally.name}`, 'peace'); updateUI(); dirtyPanel = true; } },
    { label: 'Decline', fn: () => {
      ally.favor -= 2;
      if (Math.random() < 0.15) { breakAlliance(ally); log(`😠 ${ally.name} ended the alliance after you refused to help`, 'war'); } } }

// ---- tick ----
function gameTick() {
  gt++;
  if (gt % 2 === 0) layout();
  btcPrev = btc; btc = Math.max(0.25, Math.min(3.5, btc * Math.exp((Math.random() - 0.5) * 0.14) + (1 - btc) * 0.01));
  for (const c of countries) {
    if (c.dead) continue;
    c.gold += netIncome(c);
    if (c.gold < 0) { c.gold = 0; c.units.soldier = Math.max(0, c.units.soldier - 1); }
    c.wood += c.woodRate + (c === player ? 0 : 1);
    if (c.pop < c.popCap) c.pop = Math.min(c.popCap, c.pop + 1);
  }
  if (gt % 2 === 0) for (const w of wars.slice()) fight(w);
  aiBrain();
  if (gt % 6 === 0) aiDiplomacy();
  if (gt % 5 === 0) allyRequestCheck();
  if (dirtyMap && gt % 2 === 0) { rebuildBorders(); drawMinimap(); dirtyMap = false; }
  updateUI();
  if (panelOpen && tab !== 'saves' && tab !== 'settings' && (dirtyPanel || gt % 2 === 0)) renderPanel();

panelBody.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const act = el.dataset.act, c = el.dataset.id !== undefined ? countries[+el.dataset.id] : null;
  if (act === 'found') { openWizard(el.dataset.k); return; }
  else if (act === 'fbopen') { fbView = true; renderSettings(); return; }
  else if (act === 'fbback') { fbView = false; renderSettings(); return; }
  else if (act === 'fbsend') { sendFeedback(); return; }
  else if (act === 'fbcopy') { copyFeedback(); return; }
  else if (act === 'gohome') { goHome(); return; }
  else if (act === 'saveslot') { saveSlot(el.dataset.s).then(() => { if (tab === 'saves' && panelOpen) renderSaves(); }); return; }
  else if (act === 'loadslot') { const s = el.dataset.s; popup(`<b>📂 Load ${slotName(s)}?</b><br>Your current game is replaced (the autosave keeps the last 30 seconds).`, [{ label: 'Load', fn: () => loadSlot(s) }, { label: 'Cancel' }], 1e9); return; }
  else if (act === 'delslot') { const s = el.dataset.s; popup(`<b>🗑️ Delete ${slotName(s)}?</b>`, [{ label: 'Delete', fn: () => delSlot(s).then(() => { if (tab === 'saves' && panelOpen) renderSaves(); }) }, { label: 'Cancel' }], 1e9); return; }
  else if (act === 'exportcode') { exportCode(); return; }
  else if (act === 'copycode') { copyCode(); return; }
  else if (act === 'importcode') { const b = document.getElementById('codebox'); loadCode(b ? b.value : ''); return; }
  else if (act === 'buyco') buyCompany(el.dataset.k);
  else if (act === 'buyunit') buyUnit(el.dataset.k, +el.dataset.n);
  else if (act === 'sel') selectedId = c.id;
  else if (act === 'sort') { const k = el.dataset.k; if (sortKey === k) sortDir *= -1; else { sortKey = k; sortDir = k === 'name' ? 1 : -1; } }
  else if (act === 'ally') proposeAlliance(c);
  else if (act === 'unally') breakAlliance(c);
  else if (act === 'war') playerDeclareWar(c);
  else if (act === 'peace') { const w = warBetween(player.id, c.id); if (w) askPeace(w); }
  else if (act === 'money') askMoney(c);
  else if (act === 'land') askLand(c);
  else if (act === 'goto') moveTo(c.capital.px, c.capital.pz);
  updateUI(); renderPanel();
});

function snapshot() {
  const tiles = []; let cur = -1, run = 0;
  for (const t of land) { if (t.country === cur) run++; else { if (run) tiles.push(cur, run); cur = t.country; run = 1; } }
  tiles.push(cur, run);
  const bld = []; for (const t of land) if (t.building) bld.push(t.i, BTYPES.indexOf(t.buildingType));
  const r1 = x => Math.round(x * 10) / 10;
  const cs = countries.map(c => ({
    n: c.name, g: r1(c.gold), w: r1(c.wood), p: c.pop, pc: c.popCap, gr: r1(c.goldRate), wr: r1(c.woodRate), i: c.influence, d: c.dev,
    u: [c.units.soldier, c.units.tank, c.units.ship, c.units.jet], co: c.companies, al: [...c.allies], cd: c.cool, f: c.favor,
    x: c.dead ? 1 : 0, b: c.built, cap: c.capital ? c.capital.i : 0, bi: r1(c.bonusIncome || 0), br: c.brands || []
  }));
  const data = {
    v: 1, seed: WORLD_SEED, player: player.id, gt, btc, tiles, bld, c: cs,
    wars: wars.map(w => [w.a, w.b, w.start, w.initA, w.initB, w.lostA, w.lostB, w.stale, w.ticks, w.peaceCool]),
    truce: [...truce.entries()], logs: logs.slice(0, 40).map(l => [l.t, l.msg, l.cls])
  };
  const alive = countries.filter(c => !c.dead).length;
  return { data, meta: { seed: WORLD_SEED, nation: player.name, gt, tiles: player.tiles.length, gold: Math.floor(player.gold), power: Math.floor(power(player)), nations: alive, t: Date.now() } };
}

function applySave(S) {
  if (S.player !== player.id) { toast('That save is from a different world version'); return false; }
  gt = S.gt; btc = S.btc; btcPrev = S.btc;
  for (const c of countries) c.tiles = [];
  let li = 0;
  for (let r = 0; r < S.tiles.length; r += 2) {
    const cid = S.tiles[r], owner = countries[cid];
    for (let n = 0; n < S.tiles[r + 1]; n++) {
      const t = land[li++]; t.country = cid; owner.tiles.push(t);
      t.color = t.terrain.clone().lerp(owner.color, 0.28).offsetHSL(0, 0, t.jit);
      tileMesh.setColorAt(t.i, t.color);
    }
  }
  tileMesh.instanceColor.needsUpdate = true;
  for (let i = 0; i < S.bld.length; i += 2) placeBuilding(land[S.bld[i]], BTYPES[S.bld[i + 1]]);
  S.c.forEach((o, id) => {
    const c = countries[id];
    c.name = o.n; c.gold = o.g; c.wood = o.w; c.pop = o.p; c.popCap = o.pc; c.goldRate = o.gr; c.woodRate = o.wr; c.influence = o.i; c.dev = o.d;
    c.units = { soldier: o.u[0], tank: o.u[1], ship: o.u[2], jet: o.u[3] };
    c.companies = o.co || {}; c.allies = new Set(o.al || []); c.cool = o.cd || {}; c.favor = o.f || 0; c.dead = !!o.x; c.built = o.b;
    c.bonusIncome = o.bi || 0; c.brands = o.br || [];
    c.capital = land[o.cap] || c.tiles[0] || c.capital;
    if (c.tiles.length) {
      c.tiles.sort((a, b) => ((a.px - c.capital.px) ** 2 + (a.pz - c.capital.pz) ** 2) - ((b.px - c.capital.px) ** 2 + (b.pz - c.capital.pz) ** 2));
      c.sprite.position.set(c.capital.px, 3, c.capital.pz);
    }
    c.sprite.visible = !c.dead;
    drawLabel(c);
  });
  wars.length = 0; truce.clear();
  for (const a of S.wars) wars.push({ a: a[0], b: a[1], start: a[2], initA: a[3], initB: a[4], lostA: a[5], lostB: a[6], stale: a[7], ticks: a[8], peaceCool: a[9] });
  for (const [k, v] of S.truce) truce.set(k, v);
  logs.length = 0; for (const l of S.logs) logs.push({ t: l[0], msg: l[1], cls: l[2] });
  nameInput.value = player.name;
  dirtyMap = true; rebuildBorders(); drawMinimap(); dirtyMap = false;
  goHome(); updateUI(); dirtyPanel = true;
  return true;
}

// ---- compression + codes ----
async function pack(obj) {
  const json = JSON.stringify(obj);
  try {
    if (typeof CompressionStream !== 'undefined') {
      const buf = new Uint8Array(await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());
      let bin = ''; for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
      return 'Z:' + btoa(bin);
    }
  } catch (e) {}
  return 'J:' + json;
}
async function unpack(str) {
  str = String(str).trim().replace(/^ISL1:/, '');
  if (str.startsWith('J:')) return JSON.parse(str.slice(2));
  if (str.startsWith('Z:')) {
    const bin = atob(str.slice(2).replace(/\s+/g, '')), buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    return JSON.parse(await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
  }
  throw new Error('not a save code');
}

// ---- storage: private database (if this viewer has one) + this browser ----
const store = { db: null, uid: null, ready: false, local: false };
try { localStorage.setItem('island_probe', '1'); localStorage.removeItem('island_probe'); store.local = true; } catch (e) {}
const initStore = (async () => {
  try {
    if (typeof claude !== 'undefined' && claude && claude.use) {
      const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
      const uid = user ? await user.id() : null;
      if (db && uid) { store.db = db; store.uid = uid; }
    }
  } catch (e) {}
  store.ready = true;
})();
const lsKey = s => 'island_slot_' + s;
const slotDoc = s => store.db.collection('data/users/' + store.uid).doc('slot_' + s);
async function putSlot(s, rec) {
  let ok = false;
  try { localStorage.setItem(lsKey(s), JSON.stringify(rec)); ok = true; } catch (e) {}
  if (store.db) { try { await slotDoc(s).set(rec); ok = true; } catch (e) {} }
  return ok;
}
async function getSlot(s) {
  let best = null;
  try { const raw = localStorage.getItem(lsKey(s)); if (raw) best = JSON.parse(raw); } catch (e) {}
  if (store.db) { try { const d = await slotDoc(s).get(); if (d.exists) { const r = d.data(); if (r && r.meta && (!best || r.meta.t > best.meta.t)) best = r; } } catch (e) {} }
  return best;
}
async function delSlot(s) {
  try { localStorage.removeItem(lsKey(s)); } catch (e) {}
  if (store.db) { try { await slotDoc(s).delete(); } catch (e) {} }
}
async function saveSlot(s, quiet) {
  const snap = snapshot();
  const ok = await putSlot(s, { meta: snap.meta, data: await pack(snap.data) });
  if (!quiet) toast(ok ? `💾 Saved to ${slotName(s)}` : '⚠️ Could not store the save – use “Copy save code” instead');
  return ok;
}
function bootInto(data) {
  if (!bootStash(data)) { toast('This browser blocked reloading – use a save code instead'); return; }
  toast('Loading…'); setTimeout(() => location.reload(), 150);
}
async function loadSlot(s) {
  const rec = await getSlot(s); if (!rec) { toast('That slot is empty'); return; }
  try { bootInto(await unpack(rec.data)); } catch (e) { toast('That save is damaged'); }
}
async function loadCode(text) {
  try { const d = await unpack(text); if (!d || !d.seed || !d.c) throw 0; bootInto(d); } catch (e) { toast('That code is not a valid save'); }
}

// autosave: never overwrite an older game until the player has chosen what to do with it
let autoStarted = false, lastAutoGt = -1;
async function autosave() {
  if (gameEnded || blockAuto || gt === lastAutoGt || gt < 5) return;
  if (!autoStarted) {
    autoStarted = true;
    const prev = await getSlot(AUTO);
    if (prev && prev.meta && prev.meta.seed !== WORLD_SEED) await putSlot(AUTO2, prev);     // keep the last session's autosave
  }
  lastAutoGt = gt;
  await saveSlot(AUTO, true);
}

window.addEventListener('pagehide', () => { autosave(); });
(async function offerContinue() {
  if (BOOT) { lastAutoGt = -1; return; }
  blockAuto = true;                       // until we know whether an older game is waiting
  await initStore;
  const a = await getSlot(AUTO);
  if (!a || !a.meta || a.meta.seed === WORLD_SEED) { blockAuto = false; return; }

    [{ label: '▶ Continue', fn: () => loadSlot(AUTO) }, { label: 'New world', fn: () => { blockAuto = false; } }], 1e9);

// Picking: march the camera ray through the tile grid (cheap even with 13k tiles)
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
function pickTile(e) {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const o = raycaster.ray.origin, d = raycaster.ray.direction;
  if (d.y >= -0.001) return -1;
  const top = 2, t0 = o.y > top ? (o.y - top) / -d.y : 0, t1 = (o.y + 0.2) / -d.y;
  for (let t = t0; t < t1; t += 0.12) {
    const px = o.x + d.x * t, py = o.y + d.y * t, pz = o.z + d.z * t;
    const gx = Math.round((px + offX) / TILE_SIZE), gz = Math.round((pz + offZ) / TILE_SIZE);
    if (gx < 0 || gz < 0 || gx >= MAP_W || gz >= MAP_H) continue;
    const idx = cellIdx[gz * MAP_W + gx];
    if (idx >= 0 && py <= land[idx].topY) return idx;
  }
  return -1;
}

const HOVER_OWN = new THREE.Color(0x7dd3fc), HOVER_FOREIGN = new THREE.Color(0xfca5a5);
const tipEl = document.getElementById('tip'), toastEl = document.getElementById('toast');
let hovered = -1, toastTimer = 0;
const NAMES = { house: 'House', lumber: 'Lumber camp', market: 'Market', tower: 'Crystal tower' };
function toast(msg) { toastEl.textContent = msg; toastEl.style.opacity = 1; clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.style.opacity = 0, 1800); }

function updateHover(e) {
  const next = pickTile(e);
  if (next === hovered) return;
  if (hovered >= 0) tileMesh.setColorAt(hovered, land[hovered].color);
  if (next >= 0) {
    const t = land[next];
    tileMesh.setColorAt(next, t.country === player.id ? HOVER_OWN : HOVER_FOREIGN);
    tipEl.textContent = countries[t.country].name + (t.buildingType ? ' · ' + NAMES[t.buildingType] : '') + (t.country === player.id ? ' (yours)' : '');
  } else tipEl.textContent = '';
  tileMesh.instanceColor.needsUpdate = true;
  hovered = next;
}
window.addEventListener('pointermove', (e) => { if (e.target === renderer.domElement) updateHover(e); });

// Build only on a click, not at the end of a drag
let down = null;
window.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY, button: e.button, onCanvas: e.target === renderer.domElement }; });
window.addEventListener('pointerup', (e) => {
  const d = down; down = null;
  if (!d || !d.onCanvas || d.button !== 0 || Math.hypot(e.clientX - d.x, e.clientY - d.y) > 6) return;
  updateHover(e);
  if (hovered < 0) return;
  const tile = land[hovered];
  if (tile.country !== player.id) { selectCountry(tile.country, true); return; }

  if (state.selectedTool === 'demolish') {
    if (tile.building) {
      applyBuilding(player, tile.buildingType, -1);
      scene.remove(tile.building);
      tile.building = null; tile.buildingType = null;
      rebuildCrystals();
      updateUI();
    }
    return;
  }

  if (tile.building) return;
  const cost = BUILDINGS[state.selectedTool];
  if (state.gold >= cost.gold && state.wood >= cost.wood) {
    state.gold -= cost.gold; state.wood -= cost.wood;
    applyBuilding(player, state.selectedTool, 1);
    placeBuilding(tile, state.selectedTool);
    updateUI();
  } else toast('Not enough gold or wood');
});

  r.setProperty('--bot', ((narrow ? tb.offsetHeight + 12 : 14) + hb.offsetHeight + 8) + 'px');
}
window.addEventListener('resize', layout); window.addEventListener('orientationchange', () => setTimeout(layout, 200));
layout();
setInterval(gameTick, 1000);

// Minimap (click or drag to jump)
const mm = document.getElementById('minimap'), mmCanvas = document.getElementById('mm-canvas'), mmDot = document.getElementById('mm-dot');
mmCanvas.width = MAP_W; mmCanvas.height = MAP_H;
function drawMinimap() {
  const g = mmCanvas.getContext('2d');
  g.fillStyle = '#075985'; g.fillRect(0, 0, MAP_W, MAP_H);
  for (const t of land) {
    const c = countries[t.country].color;
    g.fillStyle = t.country === player.id ? '#facc15' : `rgb(${(c.r * 255) | 0},${(c.g * 255) | 0},${(c.b * 255) | 0})`;
    g.fillRect(t.x, t.z, 1, 1);
  }
}
drawMinimap();
function moveTo(wx, wz) {
  const nx = Math.max(-offX, Math.min(offX, wx)), nz = Math.max(-offZ, Math.min(offZ, wz));
  const dx = nx - controls.target.x, dz = nz - controls.target.z;
  controls.target.x += dx; controls.target.z += dz;
  camera.position.x += dx; camera.position.z += dz;
}
function mmJump(e) {
  const r = mm.getBoundingClientRect();
  moveTo(((e.clientX - r.left) / r.width) * MAP_W * TILE_SIZE - offX - TILE_SIZE / 2, ((e.clientY - r.top) / r.height) * MAP_H * TILE_SIZE - offZ - TILE_SIZE / 2);
}
let mmDrag = false;
mm.addEventListener('pointerdown', (e) => { mmDrag = true; mm.setPointerCapture(e.pointerId); mmJump(e); });
mm.addEventListener('pointermove', (e) => { if (mmDrag) mmJump(e); });
mm.addEventListener('pointerup', () => { mmDrag = false; });

// Keyboard panning
const keys = new Set();
function goHome() {
  controls.target.set(player.capital.px, 0.5, player.capital.pz);
  camera.position.set(player.capital.px + 16, 18, player.capital.pz + 16);
  controls.update();
}
document.getElementById('home-btn').addEventListener('click', goHome);
window.addEventListener('keydown', (e) => {
  if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
  if (e.code === 'KeyH') { goHome(); return; }
  keys.add(e.code);
});
window.addEventListener('keyup', (e) => keys.delete(e.code));
const fwd = new THREE.Vector3(), right = new THREE.Vector3();

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1), t = clock.elapsedTime;
  crystals.forEach((c, i) => {
    c.rotation.y = t * 1.5;
    c.position.y = 1.85 + Math.sin(t * 3 + i) * 0.08;
  });
  updateEffects(t);
  updateBattles(t);

  const dist = camera.position.distanceTo(controls.target);
  if (keys.size) {
    camera.getWorldDirection(fwd); fwd.y = 0; fwd.normalize();
    right.crossVectors(fwd, camera.up).normalize();
    const s = dist * 0.9 * dt;
    let mx = 0, mz = 0;
    if (keys.has('KeyW') || keys.has('ArrowUp')) { mx += fwd.x; mz += fwd.z; }
    if (keys.has('KeyS') || keys.has('ArrowDown')) { mx -= fwd.x; mz -= fwd.z; }
    if (keys.has('KeyD') || keys.has('ArrowRight')) { mx += right.x; mz += right.z; }
    if (keys.has('KeyA') || keys.has('ArrowLeft')) { mx -= right.x; mz -= right.z; }
    moveTo(controls.target.x + mx * s, controls.target.z + mz * s);
  }
  controls.update();
  // keep the view inside the world
  const cx = Math.max(-offX, Math.min(offX, controls.target.x)), cz = Math.max(-offZ, Math.min(offZ, controls.target.z));
  camera.position.x += cx - controls.target.x; camera.position.z += cz - controls.target.z;
  controls.target.x = cx; controls.target.z = cz;

  sun.position.set(controls.target.x + 60, 100, controls.target.z + 40);
  sun.target.position.copy(controls.target);
  const near = Math.max(0, Math.min(1, (dist - 22) / 25));
  for (const c of countries) {
    if (c.dead) { c.sprite.visible = false; continue; }
    const o = near * Math.max(0, Math.min(1, (c.showUntil - dist) / 30));
    c.sprite.material.opacity = o; c.sprite.visible = o > 0.01 && !c.dead;
  }
  const far = Math.max(0, Math.min(1, (dist - 230) / 70));
  for (const c of continents) { c.sprite.material.opacity = far; c.sprite.visible = far > 0.01; }
  mmDot.style.left = ((controls.target.x + offX) / (MAP_W * TILE_SIZE) * 100) + '%';
  mmDot.style.top = ((controls.target.z + offZ) / (MAP_H * TILE_SIZE) * 100) + '%';
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

if (BOOT) applySave(BOOT);
updateUI();
animate();
gameLive = true;
setTab('nations'); setTab('nations'); // builds the panel once, leaves it closed

</script>
</body>
</html>
